- name: move TLS crt
  template:
    src: "tls.crt"
    dest: "/etc/v2ray/tls.crt"
  when: enable_tls


- name: move TLS key
  template:
    src: "tls.key"
    dest: "/etc/v2ray/tls.key"
  when: enable_tls

- name: V2Ray备份并清理任务
  block:
    # 1. 检查目标路径
    - name: 检查V2Ray路径状态
      ansible.builtin.stat:
        path: /usr/local/bin/v2ray
      register: v2ray_path
      ignore_errors: yes
      changed_when: false

    # 2. 创建备份目录
    - name: 创建备份目录
      ansible.builtin.file:
        path: "/tmp/v2ray_backups"
        state: directory
        mode: '0755'
      when: v2ray_path.stat.exists is defined and v2ray_path.stat.exists

    # 3. 执行备份（文件/目录）
    - name: 备份V2Ray文件
      ansible.builtin.copy:
        src: /usr/local/bin/v2ray
        dest: "/tmp/v2ray_backups/v2ray-"
        remote_src: yes
      when:
        - v2ray_path.stat.exists is defined
        - v2ray_path.stat.exists
        - v2ray_path.stat.isreg is defined and v2ray_path.stat.isreg
      register: file_backup

    - name: 备份V2Ray目录
      ansible.builtin.command: >
        tar -zcf "/tmp/v2ray_backups/v2ray-.tar.gz"
        -C /usr/local/bin v2ray
      when:
        - v2ray_path.stat.exists is defined
        - v2ray_path.stat.exists
        - v2ray_path.stat.isdir is defined and v2ray_path.stat.isdir
      register: dir_backup

    # 4. 统一验证备份
    - name: 验证备份文件
      ansible.builtin.stat:
        path: "/tmp/v2ray_backups/v2ray-{{ (v2ray_path.stat.isdir is defined and v2ray_path.stat.isdir) | ternary('.tar.gz','') }}"
      register: backup_verify
      when: v2ray_path.stat.exists is defined and v2ray_path.stat.exists

    # 5. 安全删除（带条件检查）
    - name: 删除原V2Ray
      ansible.builtin.file:
        path: /usr/local/bin/v2ray
        state: absent
      when:
        - backup_verify.stat.exists is defined
        - backup_verify.stat.exists
        - backup_verify.stat.size|default(0) > 0

  rescue:
    - name: 错误处理通知
      ansible.builtin.debug:
        msg: |
          备份过程中出现错误！
          原文件状态：{{ v2ray_path.stat.exists | default('未知') }}
          备份状态：{{ backup_verify.stat.path | default('未生成') }}
          已跳过删除操作，请手动检查！